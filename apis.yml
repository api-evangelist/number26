aid: number26
name: Number26
description: >-
  Number26 — trading as N26 (legally N26 GmbH) — is a German licensed digital
  bank offering 100% mobile banking to more than 8 million customers across 24
  European markets. Founded in Berlin in 2013 and holding a full banking licence
  from Germany's Federal Financial Supervisory Authority (BaFin), N26 provides
  current accounts with virtual and physical Mastercard debit cards, instant
  savings with variable interest, in-app stock/ETF and cryptocurrency investing,
  real-time spending insights, sub-accounts (Spaces), and travel features such as
  foreign-exchange and insurance, across a free tier and paid Smart, Go, and Metal
  plans plus matching business accounts. N26 is a consumer neobank and does not
  publish a public developer API, developer portal, or API documentation; this
  API Evangelist profile tracks the company's public web presence.
